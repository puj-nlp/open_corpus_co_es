[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open_corpus_co_es"
version = "0.1.1a4"
description = "Corpus en español de Colombia para procesamiento de lenguaje natural"
authors = [
    {name = "Luis Gabriel Moreno Sandoval", email = "morenoluis@javeriana.edu.co"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = ["nltk", "pandas", "gdown", "pyarrow", "fastparquet", "tqdm", "requests", "openpyxl"]

[project.optional-dependencies]
dev = ["build", "twine", "pytest"]

[tool.setuptools]
packages = ["open_corpus_co_es"]
include-package-data = true

[tool.setuptools.package-data]
open_corpus_co_es = ["catalog.json"]
